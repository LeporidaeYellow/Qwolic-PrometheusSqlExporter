spring.application.name=qwolic-sql-exporter
management.endpoints.web.exposure.include=prometheus,metrics

scheduler.period.observer=0 */10 * * * *
scheduler.period.cleaner=0 */10 * * * *


# minimum number of threads
executor.core.pool.size=2
# maximum number of threads
executor.max.pool.size=4
# the size of the queue of pending tasks
executor.queue.capacity=8
# lifetime of idle threads
executor.keep.alive.seconds=60
# waiting for all tasks to be completed when the application ends
executor.wait.for.tasks.to.complete.on.shutdown=true
# waiting for threads to finish when the application is stopped
executor.await.termination.seconds=60

logging.level.root=info